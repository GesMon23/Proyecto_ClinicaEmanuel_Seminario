# Frontend (SPA) + proxy a la API. Igual en todos los entornos: el dominio y HTTPS los resuelve el
# proxy de entrada (Caddy, ver docker-compose.yml), que reenvía aquí por HTTP.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fotos de pacientes en base64 (express.json acepta hasta 50 MB)
  client_max_body_size 50m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Eventos en tiempo real de la pantalla de TV: sin búfer ni corte por inactividad
  location = /api/turnos/llamado-sse {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host $http_host;
    proxy_set_header   Connection '';
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 1h;
  }

  # Se conserva el prefijo /api (como el proxy de Vite en desarrollo)
  location /api/ {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host $http_host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Archivos de Vite con hash en el nombre: se pueden cachear para siempre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
  }

  # index.html nunca se cachea, para que un despliegue nuevo se vea de inmediato
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

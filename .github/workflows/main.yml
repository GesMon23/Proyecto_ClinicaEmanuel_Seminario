name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Mismo ajuste que el Dockerfile: hay dependencias con peers desalineados
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db_clinica
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinica -d db_clinica"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: db_clinica
      PGUSER: clinica
      PGPASSWORD: clinica_ci
      JWT_SECRET: secreto_de_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Base nueva desde las migraciones: comprueba también que un entorno nuevo se puede levantar
      - run: npm run migrar
      - run: npm test

  # Solo en main: publica las imágenes en GitHub Container Registry, etiquetadas con el SHA del commit.
  # Preproducción y producción despliegan esas mismas imágenes (ETIQUETA=<sha> en su .env).
  imagenes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de las imágenes (GHCR exige minúsculas)
        run: echo "PREFIJO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.PREFIJO }}/backend:${{ github.sha }},${{ env.PREFIJO }}/backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.PREFIJO }}/frontend:${{ github.sha }},${{ env.PREFIJO }}/frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
